{% extends 'base.html' %}
{% block title %}Error {{ error_code }}{% endblock %}
{% block body %}
{% block guest_content %}
<div class="auth-wrapper">
    <div class="auth-card" style="text-align:center;">
        <i class="bi bi-exclamation-triangle" style="font-size:64px; color:var(--warning);"></i>
        <h1 class="auth-title" style="margin-top:16px;">{{ error_code }}</h1>
        <p class="auth-subtitle">{{ error_message }}</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary" style="margin-top:16px;">
            <i class="bi bi-house"></i> Back to Dashboard
        </a>
    </div>
</div>
{% endblock %}
{% endblock %}
